# ============================================================
# Personal Workbench - 生产部署（使用预构建多架构镜像）
# 直接从 GHCR 拉取镜像，无需本地构建
# 适配 amd64 / arm64 / arm/v7 架构
# ============================================================
# 用法：
#   docker compose -f docker-compose.prod.yml up -d
# 自定义端口：
#   PORT=3000 docker compose -f docker-compose.prod.yml up -d
# ============================================================

version: "3.8"

services:
  # 后端 API 服务
  backend:
    image: ghcr.io/moonbai/personal-workbench-backend:latest
    container_name: workbench-backend
    restart: unless-stopped
    volumes:
      - workbench-data:/app/data
    environment:
      - PORT=3001
      - DB_PATH=/app/data/workbench.db
      - UPLOAD_DIR=/app/data/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - workbench-net

  # 前端 Nginx 服务
  frontend:
    image: ghcr.io/moonbai/personal-workbench-frontend:latest
    container_name: workbench-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - workbench-net

volumes:
  workbench-data:
    driver: local

networks:
  workbench-net:
    driver: bridge
