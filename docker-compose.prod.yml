# ============================================================
# Personal Workbench - 生产部署（使用预构建多架构镜像）
# 直接从 GHCR 拉取镜像，无需本地构建
# 适配 amd64 / arm64 / arm/v7 架构
# ============================================================
# 用法：
#   docker compose -f docker-compose.prod.yml up -d
# 自定义端口：
#   cp .env.example .env && 修改 PORT
# 访问地址：http://localhost:${PORT:-8080}
# ============================================================

version: "3.8"

services:
  # 后端 API 服务
  backend:
    image: ghcr.io/moonbai/personal-workbench-backend:latest
    container_name: workbench-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    volumes:
      - workbench-data:/app/data
    environment:
      - PORT=3001
      - DB_PATH=/app/data/workbench.db
      - UPLOAD_DIR=/app/data/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - workbench-net

  # 前端 Nginx 服务
  frontend:
    image: ghcr.io/moonbai/personal-workbench-frontend:latest
    container_name: workbench-frontend
    restart: unless-stopped
    ports:
      # 对外端口，默认 8080，可通过 .env 或环境变量 PORT 自定义
      - "${PORT:-8080}:80"
    depends_on:
      # 不死等健康检查 — 前端先启动，Nginx 代理会自动重试后端连接
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - workbench-net

volumes:
  workbench-data:
    driver: local

networks:
  workbench-net:
    driver: bridge
