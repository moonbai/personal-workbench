# ============================================================
# Personal Workbench - Multi-arch Docker Build, Publish & Release
# ============================================================
# 触发条件：push 到 main 分支 / 发布 Tag / PR / 手动触发
# 目标平台：linux/amd64, linux/arm64, linux/arm/v7
# 镜像仓库：GitHub Container Registry (ghcr.io)
# 发布 Release：推送 v* 标签时自动创建 GitHub Release
# ============================================================

name: Build & Publish Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

permissions:
  contents: write   # 创建 Release 需要 write 权限
  packages: write

jobs:
  # ============================================================
  # Job 1: 构建多架构 Docker 镜像
  # ============================================================
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: frontend
            context: .
            dockerfile: ./Dockerfile
            description: "Personal Workbench - Frontend (Nginx)"
          - image: backend
            context: ./server
            dockerfile: ./server/Dockerfile
            description: "Personal Workbench - Backend (Node.js + SQLite)"

    steps:
      # ---- 1. 检出代码 ----
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 2. 设置 QEMU（跨架构模拟）----
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,arm

      # ---- 3. 设置 Docker Buildx ----
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ---- 4. 登录 GHCR ----
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- 5. 生成镜像标签和 OCI 标注 ----
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            # latest 标签（仅 main 分支）
            type=raw,value=latest,enable={{is_default_branch}}
            # 分支名
            type=ref,event=branch
            # PR 标签
            type=ref,event=pr
            # 语义化版本：v1.2.3 → 1.2.3, 1.2, 1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Git SHA 短哈希
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Personal Workbench ${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # ---- 6. 构建并推送多架构镜像 ----
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  # ============================================================
  # Job 2: 创建 GitHub Release（仅推送 v* 标签时触发）
  # ============================================================
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 1. 提取版本号 ----
      - name: Extract version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "📋 Tag: $TAG | Version: $VERSION"

      # ---- 2. 生成部署用的 docker-compose 文件 ----
      # 将镜像标签替换为具体版本号，用户下载后直接可用
      - name: Generate release compose file
        run: |
          mkdir -p release-assets
          # 替换镜像标签为当前版本号
          sed 's/:latest$/:${{ steps.version.outputs.version }}/' docker-compose.prod.yml > release-assets/docker-compose.yml
          # 复制 .env.example
          cp .env.example release-assets/.env.example

      # ---- 3. 生成快速部署指南 ----
      - name: Generate quick-start guide
        run: |
          cat > release-assets/QUICKSTART.md << 'GUIDE_EOF'
          # Personal Workbench 快速部署指南

          ## 方式一：Docker Compose 一键启动（推荐）

          1. 下载本 Release 中的 `docker-compose.yml` 和 `.env.example`
          2. 放到同一目录下，执行：

          ```bash
          # 复制环境变量模板（可选，默认端口 8080）
          cp .env.example .env

          # 拉取镜像并启动
          docker compose up -d
          ```

          3. 浏览器访问 http://localhost:8080

          ## 方式二：手动 docker run

          ```bash
          # 创建网络
          docker network create workbench-net

          # 启动后端
          docker run -d --name workbench-backend \
            --network workbench-net \
            -v workbench-data:/app/data \
            -e PORT=3001 \
            -e DB_PATH=/app/data/workbench.db \
            -e UPLOAD_DIR=/app/data/uploads \
            --restart unless-stopped \
            ghcr.io/moonbai/personal-workbench-backend:latest

          # 启动前端
          docker run -d --name workbench-frontend \
            --network workbench-net \
            -p 8080:80 \
            --restart unless-stopped \
            ghcr.io/moonbai/personal-workbench-frontend:latest
          ```

          ## 自定义端口

          编辑 `.env` 文件修改 `PORT=3000`，或直接指定：

          ```bash
          PORT=3000 docker compose up -d
          ```

          ## 数据备份

          ```bash
          docker run --rm -v workbench-data:/data -v $(pwd):/backup alpine \
            cp /data/workbench.db /backup/workbench-backup-$(date +%Y%m%d).db
          ```

          ## 支持的架构

          | 架构 | 典型设备 |
          |---|---|
          | linux/amd64 | x86 服务器 / PC / 云主机 |
          | linux/arm64 | Apple Silicon / 树莓派 4/5 |
          | linux/arm/v7 | 树莓派 3 / 旧款 ARM 设备 |
          GUIDE_EOF

      # ---- 4. 创建 GitHub Release ----
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          generate_release_notes: true
          body: |
            ---

            ## 🚀 快速部署

            下载下方 `docker-compose.yml` 和 `.env.example`，执行：

            ```bash
            docker compose up -d
            ```

            访问 http://localhost:8080 即可使用。

            详见 `QUICKSTART.md` 完整部署指南。

            ## 📦 Docker 镜像

            | 镜像 | 地址 |
            |---|---|
            | 前端 | `ghcr.io/moonbai/personal-workbench-frontend:${{ steps.version.outputs.version }}` |
            | 后端 | `ghcr.io/moonbai/personal-workbench-backend:${{ steps.version.outputs.version }}` |

            支持架构：`linux/amd64`、`linux/arm64`、`linux/arm/v7`

            ## 📝 说明

            完整文档请访问 [README](https://github.com/moonbai/personal-workbench#readme)。
          files: |
            release-assets/docker-compose.yml
            release-assets/.env.example
            release-assets/QUICKSTART.md

  # ============================================================
  # Job 3: 可选 — 同步推送到 Docker Hub
  # 需要在仓库 Settings → Secrets 中配置：
  #   DOCKERHUB_USERNAME - Docker Hub 用户名
  #   DOCKERHUB_TOKEN    - Docker Hub Access Token
  # ============================================================
  publish-dockerhub:
    name: Sync to Docker Hub
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DOCKERHUB_USERNAME != ''
    strategy:
      fail-fast: false
      matrix:
        image: [frontend, backend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/workbench-${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Personal Workbench ${{ matrix.image }}
            org.opencontainers.image.description=个人工作台 - ${{ matrix.image }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image == 'frontend' && '.' || './server' }}
          file: ${{ matrix.image == 'frontend' && './Dockerfile' || './server/Dockerfile' }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
