# ============================================================
# Personal Workbench - 本地开发编排（从源码构建）
# 用法：
#   docker compose up -d --build
# 自定义端口：
#   cp .env.example .env && 修改 PORT
# 访问地址：http://localhost:${PORT:-8080}
# ============================================================

version: "3.8"

services:
  # 后端 API 服务
  backend:
    build: ./server
    container_name: workbench-backend
    restart: unless-stopped
    # 资源限制：防止突发占用挤占宿主机
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    volumes:
      # 数据持久化：SQLite 数据库和上传的头像
      - workbench-data:/app/data
    environment:
      - PORT=3001
      - DB_PATH=/app/data/workbench.db
      - UPLOAD_DIR=/app/data/uploads
    healthcheck:
      # curl -f 在 HTTP 4xx/5xx 时返回非零退出码，兼容性优于 wget
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # 日志滚动：防止长期运行日志占满磁盘
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - workbench-net

  # 前端 Nginx 服务
  frontend:
    build: .
    container_name: workbench-frontend
    restart: unless-stopped
    ports:
      # 对外端口，默认 8080，可通过 .env 或环境变量 PORT 自定义
      - "${PORT:-8080}:80"
    volumes:
      # 挂载整个 www/ 目录，后续往里放文件即可直接访问
      # 访问 / → www/index.html（自适应版）
      # 访问 /desktop.html → www/desktop.html（桌面版）
      # 访问 /mobile.html → www/mobile.html（手机版）
      # 访问 /xxx.html → www/xxx.html（自定义页面）
      - ./www:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - workbench-net

volumes:
  workbench-data:
    driver: local

networks:
  workbench-net:
    driver: bridge
